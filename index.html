      <h2>Process</h2>
      <section><h3>Buyer</h3><ol>
        <li><h4>Define the search.</h4><p>Model or model family, budget, country, intended use and financing.</p></li>
        <li><h4>Shortlist listings.</h4><p>I compare public listings and list what is claimed, what can be checked and what is unknown.</p></li>
        <li><h4>Organise the documents.</h4><p>Logbooks, registration and airworthiness papers: I flag missing items. A search of the relevant country's registry does not by itself establish ownership.</p></li>
        <li><h4>Written agreement.</h4><p>Fees, deposit and inspection conditions are set in writing between the parties; nothing is assumed.</p></li>
        <li><h4>Independent pre-purchase inspection.</h4><p>The buyer chooses a qualified maintenance provider. I do not inspect aircraft.</p></li>
        <li><h4>Closing.</h4><p>After the inspection, the buyer decides. I coordinate communication and documents until the paperwork is complete; procedures depend on the country of registration.</p></li>
      </ol></section>
      <section><h3>Seller</h3><ol>
        <li><h4>Prepare the file.</h4><p>With your agreement, I put available logbooks and documents into PDF and coordinate photos.</p></li>
        <li><h4>Set the price and publish.</h4><p>I rely on comparable listings and publish, with your written agreement, on platforms suited to the market. I only publish what is confirmed.</p></li>
        <li><h4>Screen inquiries.</h4><p>I filter out casual inquiries and ask about financing and, where appropriate, proof of funds.</p></li>
        <li><h4>Written agreement.</h4><p>Same principles as for buyers: conditions, deposit and inspection set in writing.</p></li>
        <li><h4>Buyer's inspection.</h4><p>An independent professional chosen by the buyer examines the aircraft.</p></li>
        <li><h4>Closing.</h4><p>I coordinate communication and documents until the paperwork is complete.</p></li>
      </ol></section>
