      <h2>Processus</h2>
      <section><h3>Acheteur</h3><ol>
        <li><h4>Définir la recherche.</h4><p>Modèle ou famille de modèles, budget, pays, usage prévu et mode de financement.</p></li>
        <li><h4>Présélectionner des annonces.</h4><p>Je compare des annonces publiques, je liste ce qui est annoncé, ce qui est vérifiable et ce qui reste inconnu.</p></li>
        <li><h4>Organiser les documents.</h4><p>Carnets, papiers d'immatriculation et de navigabilité : je repère les pièces manquantes. Une recherche au registre du pays concerné n'établit pas à elle seule le titre de propriété.</p></li>
        <li><h4>Accord écrit.</h4><p>Honoraires, acompte, conditions liées à l’inspection : tout est défini par écrit entre les parties, rien n’est présumé.</p></li>
        <li><h4>Visite préachat indépendante.</h4><p>L'acheteur choisit un organisme de maintenance qualifié. Je n'inspecte pas les avions.</p></li>
        <li><h4>Conclusion.</h4><p>Après l'inspection, l'acheteur décide. Je coordonne les échanges et les documents jusqu'à la fin des démarches, qui dépendent du pays d'immatriculation.</p></li>
      </ol></section>
      <section><h3>Vendeur</h3><ol>
        <li><h4>Préparer le dossier.</h4><p>Avec votre accord, je mets les carnets et documents disponibles en PDF et je coordonne les photos.</p></li>
        <li><h4>Fixer le prix et publier.</h4><p>Je m'appuie sur des annonces comparables et je publie, avec votre accord écrit, sur des plateformes adaptées au marché. Je ne publie que ce qui est confirmé.</p></li>
        <li><h4>Filtrer les demandes.</h4><p>J'écarte les demandes peu sérieuses, je demande où en est le financement et, si nécessaire, une preuve de fonds.</p></li>
        <li><h4>Accord écrit.</h4><p>Mêmes principes que côté acheteur : conditions, acompte et inspection définis par écrit.</p></li>
        <li><h4>Inspection par l'acheteur.</h4><p>Un professionnel indépendant choisi par l'acheteur examine l'avion.</p></li>
        <li><h4>Conclusion.</h4><p>Je coordonne les échanges et les documents jusqu’à la fin des démarches.</p></li>
      </ol></section>
